name: validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0 (как в pages.yml)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
      - run: python tools/validate.py
      - run: python tools/gen_constants.py --check
      - run: python -m pip install -q "pytest>=8,<10" "jsonschema>=4,<5" && python -m pytest -q

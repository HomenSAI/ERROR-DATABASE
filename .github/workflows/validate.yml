name: validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python tools/validate.py
      - run: python tools/gen_constants.py --check
      - run: python -m pip install -q "pytest>=8,<10" && python -m pytest -q
